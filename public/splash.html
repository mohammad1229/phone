<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحميل النظام...</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-app-region: drag; /* Allows dragging the frameless window */
        }
        body {
            background: transparent;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .splash-card {
            width: 480px;
            height: 350px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(14, 165, 233, 0.15);
            position: relative;
            overflow: hidden;
        }
        .splash-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 60%);
            animation: pulse Glow 6s infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        .logo-area {
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-glow {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
            animation: float 3s ease-in-out infinite;
        }
        .logo-glow i {
            font-size: 2.5rem;
            color: white;
        }
        h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        h1 span {
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .loading-area {
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .status-text {
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 600;
            height: 24px;
            transition: all 0.3s ease;
            text-align: center;
        }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #8b5cf6);
            border-radius: 10px;
            box-shadow: 0 0 12px #38bdf8;
            animation: fillBar 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .footer-text {
            z-index: 1;
            color: #475569;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .footer-text i {
            color: #38bdf8;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fillBar {
            0% { width: 0%; }
            20% { width: 15%; }
            40% { width: 45%; }
            70% { width: 75%; }
            100% { width: 100%; }
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-area">
            <div class="logo-glow">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <h1>gonet <span>phone</span></h1>
        </div>

        <div class="loading-area">
            <div class="status-text" id="status">تحميل خوادم gonet الذكية...</div>
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>

        <div class="footer-text">
            <i class="fa-solid fa-shield-halved"></i>
            <span>تأمين وتشغيل: شركة gonet للبرمجة والتطوير</span>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const statuses = [
            "جاري تشغيل خوادم gonet الذكية...",
            "الاتصال بقاعدة البيانات الآمنة (SQLite)...",
            "التحقق من سلامة وصلاحية ترخيص الجهاز (HWID)...",
            "تطبيق نظام الأمان وتشفير الجلسة...",
            "مرحباً بك! جاري فتح نظام FanniPro..."
        ];
        
        let index = 0;
        function updateStatus() {
            if (index < statuses.length) {
                statusEl.style.opacity = 0;
                setTimeout(() => {
                    statusEl.textContent = statuses[index++];
                    statusEl.style.opacity = 1;
                }, 300);
            }
        }
        
        // Rotate status text matches progress bar animation timing
        updateStatus();
        const interval = setInterval(() => {
            if(index >= statuses.length) {
                clearInterval(interval);
            } else {
                updateStatus();
            }
        }, 500);
    </script>
</body>
</html>
